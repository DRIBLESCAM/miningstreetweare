<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiningStreetweare</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
            background:#f2f2f7;color:#000;
            padding-top:100px;padding-bottom:80px;
        }
        header{
            position:fixed;top:0;left:0;right:0;height:100px;
            background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);
            display:flex;align-items:center;justify-content:space-between;
            padding:0 20px;z-index:1000;border-bottom:1px solid #ddd;
        }
        .search-icon{
            width:44px;height:44px;display:flex;align-items:center;justify-content:center;
            cursor:pointer;opacity:0.65;transition:0.2s;
        }
        .search-icon:hover{opacity:1;}
        .search-icon svg{width:26px;height:26px;}

        .logo{font-weight:800;font-size:20px;}
        .avatar{
            width:40px;height:40px;border-radius:50%;background:#ddd;
            display:flex;align-items:center;justify-content:center;
            font-weight:bold;font-size:18px;cursor:pointer;position:relative;
        }
        .dropdown{
            position:absolute;top:70px;right:0;background:white;
            border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.18);
            width:200px;overflow:hidden;display:none;z-index:2000;
        }
        .dropdown.show{display:block;animation:fadeIn 0.2s;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
        .dropdown a{
            display:block;padding:16px 20px;text-decoration:none;color:#000;
            font-weight:500;transition:0.2s;border-bottom:1px solid #eee;
        }
        .dropdown a:last-child{border:none;}
        .dropdown a:hover{background:#f5f5f5;}

        .filters{
            display:flex;gap:20px;justify-content:center;margin:20px 0 50px;
        }
        .filter-btn{
            padding:12px 32px;border-radius:30px;font-weight:700;font-size:15px;
            background:rgba(255,255,255,0.95);border:none;
            box-shadow:0 8px 25px rgba(0,0,0,0.12);transition:0.3s;cursor:pointer;
        }
        .filter-btn.active{background:#000;color:white;}

        .grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
            gap:22px;padding:0 20px;max-width:1400px;margin:0 auto;
        }
        .card{
            background:white;border-radius:24px;overflow:hidden;
            box-shadow:0 8px 25px rgba(0,0,0,0.1);transition:0.2s;cursor:pointer;
        }
        .card img{width:100%;height:190px;object-fit:cover;}
        .info{padding:14px;text-align:center;}
        .name{font-size:14px;font-weight:600;color:#333;margin-bottom:4px;}
        .price{font-size:16px;font-weight:700;}

        footer{text-align:center;padding:20px;color:#888;font-size:13px;background:rgba(242,242,247,0.9);}
    </style>
</head>
<body>

    <header>
        <!-- LUPA GARANTIDA COM SVG -->
        <div class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        </div>
        <div class="logo">MiningStreetweare</div>
        <div class="avatar" id="avatar">M
            <div class="dropdown" id="dropdown">
                <a href="#">Login</a>
                <a href="#">Criar conta</a>
            </div>
        </div>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="showAll()">Recentes</button>
        <button class="filter-btn" onclick="filter('sneaker')">Sneakers</button>
        <button class="filter-btn" onclick="filter('camiseta')">Camisetas</button>
    </div>

    <div class="grid">
        <div class="card" data-type="sneaker"><img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500" alt=""><div class="info"><div class="name">MS-18 Onyx</div><div class="price">R$ 2.390</div></div></div>
        <div class="card" data-type="camiseta"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt=""><div class="info"><div class="name">Mining Tee Shadow</div><div class="price">R$ 399</div></div></div>
        <!-- teus outros produtos -->
    </div>

    <footer>© 2025 MiningStreetweare</footer>

    <script>
        document.getElementById('avatar').addEventListener('click', function(e){
            e.stopPropagation();
            document.getElementById('dropdown').classList.toggle('show');
        });
        document.addEventListener('click', () => document.getElementById('dropdown').classList.remove('show'));

        function showAll(){
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.card').forEach(c => c.style.display = 'block');
        }
        function filter(t){
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.card').forEach(c => c.style.display = c.dataset.type === t ? 'block' : 'none');
        }
        window.onload = () => showAll();
    </script>
</body>
</html>
